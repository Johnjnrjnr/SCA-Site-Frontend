
  <p>SARI ÇİÇEK WEAR</p>
  <div class="wear">
    @for (item of clothingProducts(); track item){
      <div class="item">
        <img src="{{item.images[0]}}">
        <p>{{item.name}}</p>
        <div>
          <form>
        @for( size of item.variants; track size){
          <input type="radio" id="{{item.name + ' ' + size.size}}" (click)="setItem(size.size, item)" name="T-shirtSize"> <label>{{size.size}} </label>
        }
          </form>
        </div>
      </div>
    }
  </div>

  <div class="buybutton"><a (click)="addItem(selectedItem)">Add Item</a></div>
